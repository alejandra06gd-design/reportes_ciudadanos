name: reportes_ciudadanos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F8F4"
  adaptive_icon_foreground: "assets/images/app_icon.png"


flutter_native_splash:
  color: "#F7F8F4"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  fullscreen: true
  android_12:
    color: "#F7F8F4"
    image: assets/images/splash_logo.png
